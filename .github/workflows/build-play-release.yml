name: Build Play Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Google Play version code (must increase each release)
        required: true
        default: '1'
      version_name:
        description: User-visible version name
        required: true
        default: '1.0'

permissions:
  contents: read

jobs:
  release:
    name: Build signed release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          cache-provider: basic

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.AURELIUS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AURELIUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURELIUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AURELIUS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing AURELIUS_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing AURELIUS_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing AURELIUS_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing AURELIUS_KEY_PASSWORD"; exit 1; }

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AURELIUS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurelius-upload.jks"

      - name: Build signed release bundle
        env:
          AURELIUS_KEYSTORE_PATH: ${{ runner.temp }}/aurelius-upload.jks
          AURELIUS_KEYSTORE_PASSWORD: ${{ secrets.AURELIUS_KEYSTORE_PASSWORD }}
          AURELIUS_KEY_ALIAS: ${{ secrets.AURELIUS_KEY_ALIAS }}
          AURELIUS_KEY_PASSWORD: ${{ secrets.AURELIUS_KEY_PASSWORD }}
          AURELIUS_VERSION_CODE: ${{ inputs.version_code }}
          AURELIUS_VERSION_NAME: ${{ inputs.version_name }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: Aurelius-play-release-v${{ inputs.version_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
