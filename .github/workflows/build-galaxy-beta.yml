name: Build Galaxy Store Beta

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android version code (increase for each new upload)"
        required: true
        default: "1"
      version_name:
        description: "Human-readable version name"
        required: true
        default: "1.0"

permissions:
  contents: read

jobs:
  galaxy-beta:
    name: Build Galaxy Store beta AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'
          cache-provider: basic

      - name: Build Galaxy Store bundle
        env:
          AURELIUS_VERSION_CODE: ${{ inputs.version_code }}
          AURELIUS_VERSION_NAME: ${{ inputs.version_name }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload Galaxy Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: Aurelius-galaxy-beta-${{ inputs.version_name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
